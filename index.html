<!doctype html>
<html lang="en" class="overflow-x-hidden overflow-y-scroll">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#2E1A47" />
    <meta name="description" content="Wahad Shay — A World of Flavor in One Place. Globally inspired premium teas, authentic karak rituals, and artisanal baked delicacies." />
    <meta name="keywords" content="Wahad Shay, Karak Tea, Specialty Chai, UAE Cafe, Artisan Bakery, Franchise UAE, Abu Dhabi, Dubai, Sharjah, Ajman" />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wahad Shay — A World of Flavor in One Place" />
    <meta property="og:description" content="Globally inspired premium teas, authentic karak rituals, and artisanal baked delicacies." />
    <meta property="og:image" content="/logo_wahad.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wahad Shay — A World of Flavor in One Place" />
    <meta name="twitter:description" content="Globally inspired premium teas, authentic karak rituals, and artisanal baked delicacies." />
    <meta name="twitter:image" content="/logo_wahad.png" />

    <!-- Critical Above-the-fold Assets Preload -->
    <link rel="preload" as="image" href="/logo_wahad.png" type="image/png" fetchpriority="high" />
    <link rel="preload" as="image" href="/mobile-poster.webp" type="image/webp" media="(max-width: 768px)" />

    <!-- Google Fonts Preconnect & Asynchronous Loading (Non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Alexandria:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Outfit:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Alexandria:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Alexandria:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <title>Wahad Shay — A World of Flavor in One Place</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #2E1A47; overflow-x: hidden;">
    <div id="root">
      <!-- Instant Zero-Latency Pure CSS Branded Splash Screen (Eliminates White Flash on Mobile) -->
      <style>
        #initial-splash {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          height: 100svh;
          background: radial-gradient(circle at center, #4C1A6E 0%, #2E114D 60%, #150626 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 999999;
          gap: 24px;
        }
        #initial-splash-logo {
          width: 170px;
          height: auto;
          max-width: 70vw;
          object-fit: contain;
          animation: splashPulse 2s ease-in-out infinite;
          filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
        }
        #initial-splash-spinner {
          width: 28px;
          height: 28px;
          border: 2.5px solid rgba(245, 189, 32, 0.2);
          border-top-color: #F5BD20;
          border-radius: 50%;
          animation: splashSpin 0.7s linear infinite;
        }
        @keyframes splashPulse {
          0%, 100% { transform: scale(1); opacity: 0.95; }
          50% { transform: scale(1.03); opacity: 1; }
        }
        @keyframes splashSpin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div id="initial-splash">
        <img id="initial-splash-logo" src="/logo_wahad.png" alt="Wahad Shay" width="170" height="90" />
        <div id="initial-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
