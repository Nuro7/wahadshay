    <!--
      INLINE SPLASH SCREEN STYLES
      These are inlined in the <head> so the splash renders in the SAME paint
      as the first HTML byte — zero JS, zero external CSS needed.
      This eliminates the dark purple blank screen on iOS/Android while JS loads.
    -->
    <style>
      /* Reset */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background-color: #2E1A47; overflow-x: hidden; }

      /* Inline splash — visible instantly, removed by React on mount */
      #splash-inline {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #4C1A6E 0%, #2E114D 60%, #150626 100%);
        transition: opacity 0.4s ease-out;
      }

      #splash-inline.splash-hiding {
        opacity: 0;
        pointer-events: none;
      }

      #splash-inline img {
        height: clamp(90px, 24vw, 130px);
        width: auto;
        max-width: 80vw;
        object-fit: contain;
        /* Slight fade-in animation — pure CSS, zero JS */
        animation: splashLogoIn 0.35s ease-out forwards;
      }

      @keyframes splashLogoIn {
        from { opacity: 0; transform: scale(0.95); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* Subtle pulsing glow ring below logo */
      #splash-inline .splash-ring {
        margin-top: 28px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      #splash-inline .splash-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #F5BD20;
        opacity: 0.5;
        animation: splashDotPulse 1.2s ease-in-out infinite;
      }

      #splash-inline .splash-dot:nth-child(2) { animation-delay: 0.2s; }
      #splash-inline .splash-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes splashDotPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50%       { opacity: 1;   transform: scale(1.2); }
      }

      /* Accessibility: respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        #splash-inline img { animation: none; opacity: 1; transform: none; }
        #splash-inline .splash-dot { animation: none; opacity: 0.6; }
        #splash-inline { transition: none; }
      }
    </style>

    -->

        <div class="splash-dot"></div>
      </div>
    </div>
